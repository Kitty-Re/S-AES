[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saes-lab"
version = "1.1.0"
description = "信息安全导论第二次作业：S-AES 实验室"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.1"]

[project.gui-scripts]
saes-lab = "saes_app.__main__:main"

[tool.setuptools.packages.find]
include = ["saes_app*"]
